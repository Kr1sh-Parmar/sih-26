  - generic [ref=f3e104]:
    - heading "What it does not do" [level=2] [ref=f3e105]
    - paragraph [ref=f3e107]: Stated here rather than waiting to be asked.
    - list [ref=f3e108]:
      - listitem [ref=f3e109]: Every document in our dataset is generated. Real forged passports are not obtainable, for obvious reasons, so our tamper accuracy is measured against forgeries we made ourselves and labelled as such.
      - listitem [ref=f3e110]: The signatures are ours. Four of six Indian identity documents carry no cryptographic integrity today, so we built a reference issuer and say so in the interface. Swapping in a real government key changes no code.
      - listitem [ref=f3e111]: A professional forgery with matched materials would likely pass our physical checks. The system assists an officer; it does not decide.
      - listitem [ref=f3e112]: Face recognition carries measurable demographic disparity. The officer sees the margin from the threshold, and the officer decides.
