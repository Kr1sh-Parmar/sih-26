  - generic [ref=f3e9]:
    - paragraph [ref=f3e10]: Smart India Hackathon 26188 — Ministry of Home Affairs
    - heading "Three levels of certainty, and the officer is told which one." [level=1] [ref=f3e11]
    - paragraph [ref=f3e12]: A document screening system for land border checkpoints. It reads an identity document, checks it at three levels of certainty, looks for tampering, matches the holder's face, and hands the officer a verdict with reasons they can check by eye. It runs on a commodity eight-core CPU with the network cable unplugged.
